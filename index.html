<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🧟 PITFALL 2D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            touch-action: none;
        }

        /* ===== TELA DE LOGIN ===== */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        #loginScreen .logo {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff6b35;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.3), 0 4px 0 #8B4513;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 10px;
        }

        #loginScreen .logo small {
            display: block;
            font-size: 0.8rem;
            color: #c4a882;
            letter-spacing: 6px;
            text-shadow: none;
            margin-top: 5px;
        }

        .login-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 850px;
        }

        .login-box {
            background: rgba(20, 10, 5, 0.95);
            padding: 30px 40px;
            border-radius: 16px;
            border: 2px solid #8B7355;
            box-shadow: 0 0 60px rgba(255, 107, 53, 0.08);
            width: 100%;
            max-width: 380px;
            flex: 1;
            min-width: 280px;
        }

        .login-box h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            letter-spacing: 3px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #8B7355;
            border-radius: 8px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .login-box input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.1);
        }

        .login-box input::placeholder {
            color: #5a4a3a;
        }

        .login-box .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .login-box button {
            flex: 1;
            padding: 12px;
            border: 1px solid #8B7355;
            border-radius: 8px;
            background: rgba(255, 107, 53, 0.1);
            color: #ffd700;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .login-box button:hover {
            background: rgba(255, 107, 53, 0.2);
            border-color: #ff6b35;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.1);
        }

        .login-box button.primary {
            background: rgba(255, 107, 53, 0.2);
            border-color: #ff6b35;
        }

        .login-box button.primary:hover {
            background: rgba(255, 107, 53, 0.3);
        }

        .login-box .error-msg {
            color: #ff6b35;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .ranking-box {
            background: rgba(20, 10, 5, 0.95);
            padding: 25px 30px;
            border-radius: 16px;
            border: 2px solid #8B7355;
            box-shadow: 0 0 60px rgba(255, 107, 53, 0.08);
            width: 100%;
            max-width: 380px;
            flex: 1;
            min-width: 250px;
            max-height: 450px;
        }

        .ranking-box h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1rem;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(139, 115, 85, 0.3);
            padding-bottom: 10px;
        }

        .rank-header {
            display: flex;
            justify-content: space-between;
            color: #8B7355;
            font-size: 0.6rem;
            padding: 5px 8px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(139, 115, 85, 0.15);
            margin-bottom: 5px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s;
            cursor: pointer;
            border-bottom: 1px solid rgba(139, 115, 85, 0.05);
        }

        .rank-item:hover {
            background: rgba(255, 107, 53, 0.05);
        }

        .rank-item .pos {
            color: #8B7355;
            font-size: 0.7rem;
            min-width: 25px;
        }

        .rank-item .name {
            color: #c4a882;
            font-size: 0.8rem;
            flex: 1;
            margin: 0 10px;
        }

        .rank-item .stats {
            color: #ffd700;
            font-size: 0.65rem;
            display: flex;
            gap: 10px;
        }

        .rank-item .medal {
            font-size: 1.2rem;
            min-width: 30px;
            text-align: center;
        }

        .rank-item.top1 {
            background: rgba(255, 215, 0, 0.05);
            border-left: 3px solid #ffd700;
        }
        .rank-item.top2 {
            background: rgba(192, 192, 192, 0.05);
            border-left: 3px solid #c0c0c0;
        }
        .rank-item.top3 {
            background: rgba(205, 127, 50, 0.05);
            border-left: 3px solid #cd7f32;
        }

        .empty-ranking {
            color: #5a4a3a;
            text-align: center;
            font-size: 0.8rem;
            padding: 30px 10px;
        }

        .rank-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .rank-list::-webkit-scrollbar {
            width: 4px;
        }
        .rank-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .rank-list::-webkit-scrollbar-thumb {
            background: #8B7355;
            border-radius: 4px;
        }

        /* ===== JOGO ===== */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a2a1a;
        }

        #hud {
            position: fixed;
            top: 8px;
            left: 8px;
            right: 8px;
            display: none;
            justify-content: space-between;
            align-items: center;
            color: #ffd700;
            background: rgba(10, 5, 0, 0.9);
            padding: 5px 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 2px solid #8B7355;
            z-index: 100;
            flex-wrap: wrap;
            gap: 3px;
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
        }

        #hud .left,
        #hud .right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .health-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .health-bar {
            width: 60px;
            height: 8px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #8B7355;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6b35, #ffd700);
            transition: width 0.15s ease;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(139, 115, 85, 0.2);
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid #8B7355;
            font-size: 0.6rem;
            color: #ffd700;
        }

        #message {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            background: rgba(10, 5, 0, 0.9);
            padding: 3px 12px;
            border-radius: 4px;
            font-size: 0.65rem;
            backdrop-filter: blur(6px);
            border: 2px solid #8B7355;
            z-index: 100;
            white-space: nowrap;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }

        #phase-complete,
        #game-over,
        #victory {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
            background: rgba(10, 5, 0, 0.95);
            padding: 20px 35px;
            border-radius: 8px;
            backdrop-filter: blur(12px);
            border: 3px solid #ffd700;
            z-index: 200;
            display: none;
            text-align: center;
            animation: pulse 1.6s ease-in-out infinite;
            min-width: 200px;
            font-family: 'Courier New', monospace;
        }

        #phase-complete {
            border-color: #ffd700;
            color: #ffd700;
        }
        #game-over {
            border-color: #ff6b35;
            color: #ff6b35;
        }
        #victory {
            border-color: #ffd700;
            color: #ffd700;
            font-size: 1.6rem;
        }

        #phase-complete small,
        #game-over small,
        #victory small {
            display: block;
            font-size: 0.75rem;
            font-weight: normal;
            color: #c4a882;
            margin-top: 6px;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.04);
            }
        }

        #mobile-controls {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 15px 5px;
            z-index: 90;
            pointer-events: none;
        }

        #mobile-controls>* {
            pointer-events: auto;
        }

        .joypad-container {
            width: 110px;
            height: 110px;
            position: relative;
            touch-action: none;
        }

        .joypad-container .joypad-bg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(100, 150, 255, 0.1), rgba(0, 0, 0, 0.7));
            border: 2px solid rgba(100, 150, 255, 0.2);
            position: absolute;
            top: 0;
            left: 0;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .joypad-container .joypad-knob {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(100, 150, 255, 0.2), rgba(50, 80, 150, 0.05));
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(100, 150, 255, 0.15);
            transition: all 0.05s;
            pointer-events: none;
            will-change: transform;
        }

        .joypad-container .joypad-knob.active {
            border-color: rgba(100, 150, 255, 0.4);
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.15);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .action-buttons .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .action-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(200, 200, 200, 0.1);
            background: radial-gradient(circle at 40% 40%, rgba(200, 200, 200, 0.04), rgba(0, 0, 0, 0.5));
            color: #ddd;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            touch-action: none;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            color: #ccc;
        }

        .action-btn:active {
            transform: scale(0.85);
            background: radial-gradient(circle at 40% 40%, rgba(200, 200, 200, 0.12), rgba(0, 0, 0, 0.6));
            border-color: rgba(200, 200, 200, 0.3);
        }

        .action-btn.a {
            border-color: rgba(50, 200, 50, 0.15);
            color: #6bff6b;
        }
        .action-btn.b {
            border-color: rgba(255, 50, 50, 0.15);
            color: #ff6b6b;
        }
        .action-btn.x {
            border-color: rgba(50, 200, 255, 0.15);
            color: #6bcbff;
        }
        .action-btn.y {
            border-color: rgba(255, 200, 50, 0.15);
            color: #ffd76b;
        }
        .action-btn.shoot {
            width: 60px;
            height: 60px;
            font-size: 1.4rem;
            border-color: rgba(255, 50, 50, 0.15);
            background: radial-gradient(circle at 40% 40%, rgba(255, 50, 50, 0.04), rgba(0, 0, 0, 0.5));
            color: #ff6b6b;
        }
        .action-btn.shoot:active {
            background: radial-gradient(circle at 40% 40%, rgba(255, 50, 50, 0.12), rgba(0, 0, 0, 0.6));
            border-color: rgba(255, 50, 50, 0.3);
        }
        .action-btn.special {
            width: 36px;
            height: 36px;
            font-size: 0.5rem;
            border-radius: 8px;
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }
        .action-btn.special:active {
            background: rgba(255, 255, 255, 0.05);
        }
        .action-btn.shoulder {
            width: 40px;
            height: 40px;
            font-size: 0.6rem;
            border-radius: 10px;
            border-color: rgba(150, 150, 200, 0.08);
            color: #aaa;
        }

        #gamepad-status {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 0, 0.4);
            font-size: 0.55rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.05);
            z-index: 85;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }

        #gamepad-status .connected {
            color: #2ecc71;
        }
        #gamepad-status .disconnected {
            color: #e74c3c;
        }

        .touch-feedback {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.06);
            border: 2px solid rgba(100, 150, 255, 0.08);
            z-index: 80;
            animation: touchRipple 0.6s ease-out forwards;
        }

        @keyframes touchRipple {
            0% {
                width: 10px;
                height: 10px;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        @media (max-width: 768px) {
            #mobile-controls {
                display: flex !important;
            }
            .login-container {
                flex-direction: column;
                align-items: center;
            }
            .login-box,
            .ranking-box {
                max-width: 380px;
                min-width: unset;
                width: 100%;
            }
            .ranking-box {
                max-height: 300px;
            }
            .rank-list {
                max-height: 180px;
            }
            #loginScreen .logo {
                font-size: 2.5rem;
            }
            #hud {
                font-size: 0.5rem;
                padding: 3px 8px;
            }
            .health-bar {
                width: 40px;
                height: 6px;
            }
            #message {
                font-size: 0.55rem;
                padding: 3px 10px;
                bottom: 120px;
                white-space: normal;
                max-width: 90%;
            }
            #phase-complete,
            #game-over,
            #victory {
                font-size: 1.2rem;
                padding: 15px 20px;
                min-width: 150px;
            }
            .joypad-container {
                width: 90px;
                height: 90px;
            }
            .joypad-container .joypad-knob {
                width: 38px;
                height: 38px;
            }
            .action-btn {
                width: 44px;
                height: 44px;
                font-size: 0.9rem;
            }
            .action-btn.shoot {
                width: 52px;
                height: 52px;
                font-size: 1.2rem;
            }
            .action-btn.shoulder {
                width: 34px;
                height: 34px;
                font-size: 0.5rem;
            }
            .action-btn.special {
                width: 30px;
                height: 30px;
                font-size: 0.4rem;
            }
            .action-buttons .btn-row {
                gap: 6px;
            }
            .action-buttons {
                gap: 4px;
            }
            #gamepad-status {
                bottom: 115px;
                font-size: 0.5rem;
                padding: 2px 10px;
            }
        }

        @media (max-width: 480px) {
            .joypad-container {
                width: 75px;
                height: 75px;
            }
            .joypad-container .joypad-knob {
                width: 32px;
                height: 32px;
            }
            .action-btn {
                width: 36px;
                height: 36px;
                font-size: 0.7rem;
            }
            .action-btn.shoot {
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }
            .action-btn.shoulder {
                width: 28px;
                height: 28px;
                font-size: 0.4rem;
            }
            .action-btn.special {
                width: 26px;
                height: 26px;
                font-size: 0.35rem;
            }
            .action-buttons .btn-row {
                gap: 4px;
            }
            #mobile-controls {
                padding: 0 8px 5px;
            }
            #loginScreen .logo {
                font-size: 2rem;
            }
            .login-box {
                padding: 20px;
            }
            .ranking-box {
                padding: 15px 20px;
            }
            #gamepad-status {
                bottom: 100px;
                font-size: 0.4rem;
                padding: 2px 8px;
            }
        }

        @media (pointer: coarse) {
            #mobile-controls {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="loginScreen">
        <div class="logo">
            🧟 PITFALL
            <small>THE INFECTED EXPEDITION</small>
        </div>

        <div class="login-container">
            <div class="login-box">
                <h2>🔐 ACESSO</h2>
                <input type="text" id="playerName" placeholder="NOME DO JOGADOR" maxlength="20" />
                <div class="btn-group">
                    <button class="primary" id="btnLogin">ENTRAR</button>
                    <button id="btnRegister">CADASTRAR</button>
                </div>
                <div class="error-msg" id="loginError"></div>
            </div>

            <div class="ranking-box">
                <h2>🏆 RANKING</h2>
                <div class="rank-header">
                    <span>POS</span>
                    <span>JOGADOR</span>
                    <span>FASE</span>
                </div>
                <div class="rank-list" id="rankList"></div>
            </div>
        </div>
    </div>

    <!-- ===== HUD ===== -->
    <div id="hud">
        <div class="left">
            <div class="health-container">
                <span>❤️</span>
                <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
                <span id="healthText" style="min-width:16px;font-weight:bold;font-size:0.6rem;">100</span>
            </div>
            <div class="hud-item"><span>🌍</span><span id="phaseText">F1/15</span></div>
            <div class="hud-item"><span>💰</span><span id="itemsText">0/3</span></div>
            <div class="hud-item"><span>🗝️</span><span id="keysText">0</span></div>
            <div class="hud-item" style="border-color:#ff6b35;"><span>🧟</span><span id="killsText">0</span></div>
            <div class="hud-item" style="border-color:#00ccff;"><span>⚡</span><span id="powerText">Pronto</span></div>
        </div>
        <div class="right">
            <div class="hud-item" style="border-color:#ffd700;"><span>🪙</span><span id="coinsText">0</span></div>
            <div class="hud-item" style="border-color:#ffd700;"><span>🎯</span><span id="missileText">4</span></div>
            <div class="hud-item" style="border-color:#8B7355;font-size:0.5rem;"><span>👤</span><span id="playerNameDisplay">-</span></div>
        </div>
    </div>

    <div id="message">🧟 PITFALL 2D · WASD · ESPAÇO · E:Poder · X:Míssil</div>
    <div id="phase-complete">✨ SOBREVIVENTE! ✨<small>Próxima expedição</small></div>
    <div id="game-over">💀 INFECTADO<small>Clique para recomeçar</small></div>
    <div id="victory">🏆 VITÓRIA! 🏆<small>15 expedições!</small></div>

    <!-- ===== CANVAS ===== -->
    <canvas id="gameCanvas"></canvas>

    <!-- ===== CONTROLE MOBILE ===== -->
    <div id="mobile-controls">
        <div class="joypad-container" id="joypadContainer">
            <div class="joypad-bg"></div>
            <div class="joypad-knob" id="joypadKnob"></div>
        </div>

        <div class="action-buttons">
            <div class="btn-row">
                <button class="action-btn shoulder" id="btnL1" style="border-color:rgba(200,100,200,0.1);color:#cc88cc;">L1</button>
                <button class="action-btn shoulder" id="btnR1" style="border-color:rgba(200,200,100,0.1);color:#cccc88;">R1</button>
            </div>
            <div class="btn-row">
                <button class="action-btn special" id="btnSelect" style="color:rgba(255,200,100,0.3);">SEL</button>
                <button class="action-btn special" id="btnStart" style="color:rgba(100,255,200,0.3);">STA</button>
                <button class="action-btn special" id="btnMode" style="color:rgba(200,100,255,0.3);">MOD</button>
            </div>
            <div class="btn-row">
                <button class="action-btn y" id="btnY">Y</button>
                <button class="action-btn x" id="btnX">X</button>

                <button class="action-btn shoulder" id="btnL2" style="border-color:rgba(100,200,200,0.1);color:#88cccc;">L2</button>
                <button class="action-btn shoot" id="btnShoot">🔫</button>

    <!-- ===== INDICADOR GAMEPAD ===== -->

        <span id="gamepadText">Nenhum controle</span>
